<div class="app">
  <header class="topbar">
    <div class="brand">Motion<span>Link</span> Desktop</div>
    <div class="mode">Local desktop streaming client</div>
  </header>

  <main>
    <section class="controls" aria-label="Host connection">
      <label class="address-label" for="server-address">
        MotionLink Host address
        <input id="server-address" type="url" value="http://127.0.0.1:8080" autocomplete="off">
      </label>
      <button id="connect" type="button">Connect</button>
      <button id="disconnect" class="secondary" type="button" disabled>Disconnect</button>
    </section>

    <section id="video-panel" class="video-panel" aria-label="Desktop video stream" tabindex="0">
      <video id="remote-screen" autoplay muted playsinline></video>
      <button id="play-video" type="button" hidden>Start video</button>
    </section>

    <section class="input-panel" aria-live="polite">
      <div class="control-copy">
        <strong>Remote control</strong>
        <span id="control-status">Connect to check whether the host allows remote control.</span>
        <small id="native-input-status">Checking the native bridge...</small>
      </div>
      <label class="control-toggle" for="enable-control">
        <input id="enable-control" type="checkbox" disabled>
        Enable remote mouse and keyboard
      </label>
    </section>
  </main>

  <footer class="footer">
    <output id="status">Disconnected</output>
    <span>Video: H.264 / WebRTC - Remote input requires explicit approval</span>
  </footer>
</div>
